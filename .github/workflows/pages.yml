# Build de l'export web (PWA) et déploiement sur GitHub Pages.
# Prérequis : Settings > Pages > Source = « GitHub Actions ».
# Le dépôt doit s'appeler « bissabi-home-made-food » (baseUrl = /bissabi-home-made-food dans app.json).
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:web
        env:
          # Variables de dépôt (Settings > Secrets and variables > Actions > Variables). Valeurs PUBLIQUES uniquement.
          # Absentes → l’app est construite en mode paiement simulé.
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_PAYMENTS_API_URL: ${{ vars.EXPO_PUBLIC_PAYMENTS_API_URL }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
